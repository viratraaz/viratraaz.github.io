<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Text Editor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f0f0f0;
    }
    .editor-container {
      max-width: 800px;
      margin: 0 auto;
    }
    #editor {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      padding: 10px;
      font-family: monospace;
      font-size: 16px;
      resize: vertical;
      background-color: #fff;
      box-sizing: border-box;
    }
    .toolbar {
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .toolbar button {
      padding: 8px 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .toolbar button:hover {
      background-color: #0056b3;
    }
    .editor-note {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="editor-container">
  <div class="toolbar">
    <button onclick="formatText('bold')">Bold</button>
    <button onclick="formatText('italic')">Italic</button>
    <button onclick="formatText('underline')">Underline</button>
    <button onclick="copyCurrentLine()">Copy Line</button>
    <button onclick="clearText()">Clear</button>
    <button onclick="saveText()">Save</button>
  </div>
  <textarea id="editor" placeholder="Start typing here..."></textarea>
  <div class="editor-note">Your text is autosaved in this browser. Use Ctrl/Cmd + Shift + C to copy the current line.</div>
</div>

<script>
  const STORAGE_KEY = 'simple-text-editor-content';
  const CACHE_NAME = 'simple-text-editor-cache-v1';
  const CACHE_KEY = '/simple-text-editor-content';
  const editor = document.getElementById('editor');

  function formatText(command) {
    document.execCommand(command, false, null);
    editor.focus();
  }

  async function persistText(text) {
    const payload = JSON.stringify({
      text,
      savedAt: Date.now()
    });

    sessionStorage.setItem(STORAGE_KEY, text);
    localStorage.setItem(STORAGE_KEY, payload);

    if ('caches' in window) {
      const cache = await caches.open(CACHE_NAME);
      await cache.put(CACHE_KEY, new Response(payload, {
        headers: { 'Content-Type': 'application/json' }
      }));
    }
  }

  async function clearStoredText() {
    sessionStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STORAGE_KEY);

    if ('caches' in window) {
      const cache = await caches.open(CACHE_NAME);
      await cache.delete(CACHE_KEY);
    }
  }

  function parseStoredPayload(payload) {
    if (!payload) {
      return null;
    }

    try {
      const parsed = JSON.parse(payload);
      return typeof parsed.text === 'string' ? parsed.text : null;
    } catch (error) {
      return null;
    }
  }

  async function loadStoredText() {
    const sessionText = sessionStorage.getItem(STORAGE_KEY);
    if (sessionText !== null) {
      return sessionText;
    }

    const localText = parseStoredPayload(localStorage.getItem(STORAGE_KEY));
    if (localText !== null) {
      sessionStorage.setItem(STORAGE_KEY, localText);
      return localText;
    }

    if ('caches' in window) {
      const cache = await caches.open(CACHE_NAME);
      const response = await cache.match(CACHE_KEY);
      if (response) {
        const cachedPayload = await response.text();
        const cachedText = parseStoredPayload(cachedPayload);
        if (cachedText !== null) {
          sessionStorage.setItem(STORAGE_KEY, cachedText);
          localStorage.setItem(STORAGE_KEY, cachedPayload);
          return cachedText;
        }
        await cache.delete(CACHE_KEY);
      }
    }

    await clearStoredText();
    return '';
  }

  function getCurrentLine() {
    const cursorPosition = editor.selectionStart;
    const text = editor.value;
    const lineStart = text.lastIndexOf('\n', Math.max(cursorPosition - 1, 0)) + 1;
    let lineEnd = text.indexOf('\n', cursorPosition);

    if (lineEnd === -1) {
      lineEnd = text.length;
    }

    return text.slice(lineStart, lineEnd);
  }

  async function copyCurrentLine() {
    const line = getCurrentLine();

    if (!line && !editor.value) {
      window.alert('There is no text to copy yet.');
      return;
    }

    let copied = false;

    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(line);
        copied = true;
      } catch (error) {
      }
    }

    if (!copied) {
      const tempInput = document.createElement('textarea');
      tempInput.value = line;
      tempInput.setAttribute('readonly', '');
      tempInput.style.position = 'absolute';
      tempInput.style.left = '-9999px';
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
    }

    editor.focus();
  }

  function clearText() {
    editor.value = '';
    clearStoredText();
    editor.focus();
  }

  async function saveText() {
    const text = editor.value;
    await persistText(text);
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'textfile.txt';
    a.click();
    URL.revokeObjectURL(url);
  }

  editor.addEventListener('input', () => {
    persistText(editor.value);
  });

  editor.addEventListener('keydown', (event) => {
    if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === 'c') {
      event.preventDefault();
      copyCurrentLine();
    }
  });

  window.addEventListener('load', async () => {
    editor.value = await loadStoredText();
  });
</script>
</body>
</html>
